version: 1
languages:
  - go
  - rust
  - swift
  - cpp
  - typescript
diagnostic_fields:
  - rule_id
  - severity
  - message
  - file
  - line
  - column
rules:
  VET001:
    name: max-function-parameters
    default_severity: error
    default_config:
      max: 1
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: unimplemented
      cpp:
        status: compatible
        implementation: unimplemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Functions must not declare more parameters than the configured maximum.
    notes:
      - Receivers such as Go method receivers are not counted as function parameters.
      - Swift and C/C++ do not implement this rule (no dependable structural parser in those runners).
      - TypeScript implements this rule via the TypeScript compiler API.
  VET002:
    name: source-file-header-required
    default_severity: error
    default_config:
      required: false
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: implemented
      cpp:
        status: compatible
        implementation: implemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Source files must declare a leading file header when enabled.
    notes:
      - Go build constraints and generated-code markers do not count as file headers.
  VET003:
    name: source-file-header-min-length
    default_severity: error
    default_config:
      min: 0
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: implemented
      cpp:
        status: compatible
        implementation: implemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Source file headers must be at least the configured number of characters.
    notes:
      - A value of 0 disables the lower bound.
      - Header length is counted after stripping comment delimiters and surrounding whitespace.
  VET004:
    name: source-file-header-max-length
    default_severity: error
    default_config:
      max: 0
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: implemented
      cpp:
        status: compatible
        implementation: implemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Source file headers must be at most the configured number of characters.
    notes:
      - A value of 0 disables the upper bound.
      - Header length is counted after stripping comment delimiters and surrounding whitespace.
  VET005:
    name: max-source-file-lines
    default_severity: error
    default_config:
      max: 0
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: implemented
      cpp:
        status: compatible
        implementation: implemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Source files must not exceed the configured number of physical lines.
    notes:
      - A value of 0 disables the rule.
      - Line counts are based on physical source lines.
  VET006:
    name: max-function-body-lines
    default_severity: error
    default_config:
      max: 0
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: unimplemented
      cpp:
        status: compatible
        implementation: unimplemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Function bodies must not exceed the configured number of physical lines.
    notes:
      - A value of 0 disables the rule.
      - Body line counts exclude the opening and closing brace lines.
      - Swift and C/C++ do not implement this rule.
      - TypeScript implements this rule via the TypeScript compiler API.
  VET007:
    name: function-docstring-policy
    default_severity: error
    default_config:
      policy: optional
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: unimplemented
      cpp:
        status: compatible
        implementation: unimplemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Function docstrings must follow the configured policy.
    notes:
      - Supported policies are forbidden, optional, and mandatory.
      - The rule applies to named function declarations, not function literals.
      - Swift and C/C++ do not implement this rule.
      - TypeScript implements this rule via the TypeScript compiler API.
  VET008:
    name: source-format
    default_severity: error
    default_config:
      enabled: true
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: implemented
      cpp:
        status: compatible
        implementation: implemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Source files must match the language standard formatter when enabled.
    notes:
      - Enforcement delegates to industry-standard formatters rather than custom indent scanning.
      - Go uses go/format (gofmt semantics).
      - Rust invokes rustfmt (edition 2021) on the source and requires the formatted output to match the input exactly.
      - Swift invokes swift-format lint --strict.
      - C/C++ invokes clang-format --dry-run --Werror.
      - TypeScript uses Prettier (prettier.format) and requires formatted output to match the input.
      - If a required external formatter is missing from PATH, the runner fails with a clear error (does not silently skip).
  VET010:
    name: function-casing
    default_severity: error
    default_config:
      enabled: false
      style: language-default
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
        notes:
          - Go export visibility is determined by identifier casing; non-default styles can intentionally reject exported or unexported API names.
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: unimplemented
      cpp:
        status: compatible
        implementation: unimplemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Function and method names must use the configured casing style.
    notes:
      - Supported styles are off, language-default, camelCase, UpperCamelCase, snake_case, and SNAKE_CASE_FULL_CAPS.
      - language-default means exported UpperCamelCase and unexported camelCase for Go, snake_case for Rust functions, and camelCase for TypeScript functions.
      - Swift and C/C++ do not implement this rule.
      - TypeScript implements this rule via the TypeScript compiler API.
  VET011:
    name: variable-casing
    default_severity: error
    default_config:
      enabled: false
      style: language-default
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
        notes:
          - The blank identifier is ignored.
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: unimplemented
      cpp:
        status: compatible
        implementation: unimplemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Variable names must use the configured casing style.
    notes:
      - Supported styles are off, language-default, camelCase, UpperCamelCase, snake_case, and SNAKE_CASE_FULL_CAPS.
      - language-default means exported UpperCamelCase and unexported camelCase for Go, snake_case for Rust variables, and camelCase for TypeScript variables.
      - Swift and C/C++ do not implement this rule.
      - TypeScript implements this rule via the TypeScript compiler API.
  VET012:
    name: type-casing
    default_severity: error
    default_config:
      enabled: false
      style: language-default
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: unimplemented
      cpp:
        status: compatible
        implementation: unimplemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Type names must use the configured casing style.
    notes:
      - Supported styles are off, language-default, camelCase, UpperCamelCase, snake_case, and SNAKE_CASE_FULL_CAPS.
      - language-default means exported UpperCamelCase and unexported camelCase for Go, UpperCamelCase for Rust and TypeScript types.
      - Swift and C/C++ do not implement this rule.
      - TypeScript implements this rule via the TypeScript compiler API.
  VET013:
    name: constant-casing
    default_severity: error
    default_config:
      enabled: false
      style: language-default
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
        notes:
          - Go constants are legal in SNAKE_CASE_FULL_CAPS, but Go's idiomatic default is MixedCaps rather than screaming snake case.
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: unimplemented
      cpp:
        status: compatible
        implementation: unimplemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Constant names must use the configured casing style.
    notes:
      - Supported styles are off, language-default, camelCase, UpperCamelCase, snake_case, and SNAKE_CASE_FULL_CAPS.
      - language-default means exported UpperCamelCase and unexported camelCase for Go, SNAKE_CASE_FULL_CAPS for Rust constants, and camelCase for TypeScript constants.
      - Swift and C/C++ do not implement this rule.
      - TypeScript implements this rule via the TypeScript compiler API.
  VET014:
    name: github-actions-pinned
    default_severity: error
    default_config:
      enabled: false
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: implemented
      cpp:
        status: compatible
        implementation: implemented
      typescript:
        status: compatible
        implementation: implemented
    summary: GitHub workflow step actions must be pinned to full-length commit SHAs when enabled.
    notes:
      - The rule is opt-in and scans .github/workflows/*.yml and .github/workflows/*.yaml by default.
      - Only jobs.<job>.steps[*].uses entries are checked.
      - Local actions beginning ./ and Docker actions beginning docker:// are ignored.
      - Valid external action pins use exactly 40 hexadecimal characters after @.
      - Job-level reusable workflow calls are ignored.
  VET015:
    name: no-comments
    default_severity: error
    default_config:
      enabled: false
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: implemented
      cpp:
        status: compatible
        implementation: implemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Source comments are forbidden when enabled, with an implicit exception for required file headers.
    notes:
      - Configured with rules.no-comments.enabled, including language overrides.
      - CLI flag --no-comments overrides rules.no-comments.enabled and accepts =false.
      - Emits one VET015 diagnostic per comment token at its opening delimiter, with message "comment is not allowed".
      - When source-file-header.required is true, only the header group recognized by VET002 through VET004 is implicitly allowed; header presence and length checks still apply.
      - When source-file-header.required is false (the default), all comments are forbidden, including file headers.
      - Empty comments, documentation comments, and tool/compiler directive comments are included; there is no implicit directive exemption.
      - Comments inside the exempt header group are allowed, including directives in that group. Separately skipped directive or generated-marker groups are not exempt.
      - Shebangs and comment-like text in literals are not comments. Comments inside interpolated expressions are checked.
      - Function docstring policy is independent; keep it optional when forbidding comments to avoid conflicting requirements.
      - Uses Go parser comments, TypeScript compiler token trivia, the Rust compiler lexer, SwiftSyntax trivia, and Clang raw tokens.
      - C/C++ requires clang only when enabled, needs no build configuration or include dependencies, and scans inactive preprocessor branches too. Missing or failing clang is an error.
      - Existing file discovery and exclusions apply unchanged.
  VET016:
    name: forbidden-files
    default_severity: error
    default_config:
      enabled: false
      patterns: []
      exclude: []
    language_compatibility:
      go:
        status: compatible
        implementation: implemented
      rust:
        status: compatible
        implementation: implemented
      swift:
        status: compatible
        implementation: implemented
      cpp:
        status: compatible
        implementation: implemented
      typescript:
        status: compatible
        implementation: implemented
    summary: Files whose repository paths match a configured pattern are forbidden when enabled.
    notes:
      - The rule is opt-in, and enabling it with no patterns checks nothing. It bans files by path only and never reads file contents, so shebang lines are not checked.
      - Configured only under top-level rules.forbidden-files with enabled, patterns, exclude, and reason. Each runner rejects forbidden-files under languages.<lang>.rules with a config error.
      - CLI flag --forbidden-files overrides rules.forbidden-files.enabled and accepts =false. Patterns come only from the config file.
      - The rule is repo-wide, not per language. With no CLI paths it walks the whole tree from the working directory, like VET014 does for workflows. With CLI paths it walks only those paths. languages.<lang>.files and languages.<lang>.exclude do not apply.
      - Any path with a .git segment is skipped. Directory symlink cycles are visited once. Broken or looping symlinks are matched by name and never followed.
      - patterns and exclude reuse each runner's languages.<lang>.exclude glob matcher on slash-separated paths relative to the working directory. A file is reported when it matches a pattern and matches no exclude entry. Empty pattern or exclude strings are a config error.
      - The TypeScript exclude matcher is looser than the others. Its ** suffix patterns are not anchored at a path segment, so **/requirements*.txt also matches myrequirements.txt, and its dir/** prefixes also match nested dir/ segments. The conformance fixture behaves the same in every runner.
      - Emits one VET016 diagnostic per matching file at line 1, column 1, with message file type is forbidden (matches "<pattern>"), where <pattern> is the first matching entry in config order.
      - Every runner implements the same file walk, so a repository that runs several runners gets one VET016 diagnostic per matching file from each runner.
