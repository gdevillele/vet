version: 1
rules:
  max-function-parameters:
    enabled: true
    max: 1
    # Optional on every rule: appended to its diagnostics to explain why it is enforced.
    reason: group related values in a struct instead of adding parameters
  source-file-header:
    required: true
    min-length: 40
    max-length: 400
  max-source-file-lines:
    max: 300
  max-function-body-lines:
    max: 20
  function-docstring:
    policy: optional
  no-comments:
    enabled: false
  format:
    enabled: true
  casing:
    enabled: false
    functions: language-default
    variables: language-default
    types: language-default
    constants: language-default
    ignore-names: []
    ignore-patterns: []
  github-actions-pinned:
    enabled: false
  # Top-level only: repo-wide, so it is rejected under languages.<lang>.rules.
  forbidden-files:
    enabled: false
    patterns:
      - "**/*.py"
      - "**/*.pyi"
      - "**/*.pyw"
      - "**/*.ipynb"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
    exclude:
      - "design/archive/**"
    reason: Use Go for tooling and checks
languages:
  go:
    files:
      - implementations/go/...
    exclude:
      - "**/*_test.go"
    rules:
      format:
        enabled: true
  swift:
    files:
      - implementations/swift/Sources/...
    exclude:
      - "**/*Tests.swift"
    rules:
      format:
        enabled: true
  rust:
    files:
      - implementations/rust/src/...
    exclude:
      - "target/**"
    rules:
      format:
        enabled: true
  cpp:
    files:
      - src/...
      - include/...
    exclude:
      - "build/**"
      - "**/generated/**"
    rules:
      format:
        enabled: true
  typescript:
    files:
      - src/...
    exclude:
      - "**/*.test.ts"
      - "dist/**"
      - "node_modules/**"
    rules:
      format:
        enabled: true

