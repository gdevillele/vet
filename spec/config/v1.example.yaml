version: 1
rules:
  max-function-parameters:
    enabled: true
    max: 1
  source-file-header:
    required: true
    min-length: 40
    max-length: 400
  max-source-file-lines:
    max: 300
  max-function-body-lines:
    max: 20
  function-docstring:
    policy: optional
  format:
    enabled: true
  casing:
    enabled: false
    functions: language-default
    variables: language-default
    types: language-default
    constants: language-default
    ignore-names: []
    ignore-patterns: []
  github-actions-pinned:
    enabled: false
languages:
  go:
    files:
      - implementations/go/...
    exclude:
      - "**/*_test.go"
    rules:
      format:
        enabled: true
  swift:
    files:
      - implementations/swift/Sources/...
    exclude:
      - "**/*Tests.swift"
    rules:
      format:
        enabled: true
  rust:
    files:
      - implementations/rust/src/...
    exclude:
      - "target/**"
    rules:
      format:
        enabled: true
  cpp:
    files:
      - src/...
      - include/...
    exclude:
      - "build/**"
      - "**/generated/**"
    rules:
      format:
        enabled: true
  typescript:
    files:
      - src/...
    exclude:
      - "**/*.test.ts"
      - "dist/**"
      - "node_modules/**"
    rules:
      format:
        enabled: true

